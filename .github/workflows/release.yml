name: Release model

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Build and upload Campaign.rbxm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install tools
        uses: CompeyDev/setup-rokit@v0.2.1

      - name: Install dependencies
        run: wally install

      - name: Build model
        run: rojo build model.project.json --output Campaign.rbxm

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" Campaign.rbxm --clobber
